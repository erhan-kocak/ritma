<!doctype html>
<html lang="tr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <!-- Geliştirme aracı: CLAUDE.md'deki kütüphane yasağının tek istisnası. Sürüm sabit, SRI ile doğrulanır. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"

    .api-docs-intro { padding: 24px 0 0; }
    .api-docs-intro h1 { font-size: 1.75rem; margin-bottom: 6px; }
    .api-docs-intro p { color: var(--muted); }
    #swagger-ui { padding-bottom: 48px; }
    #swagger-ui .swagger-ui .info { margin: 24px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"

  <script type="module">
    window.SwaggerUIBundle({
      url: "/api/openapi.json",
      dom_id: "#swagger-ui",
      tryItOutEnabled: true,
      displayRequestDuration: true,
    });
  </script>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="logo" aria-label="Ritma ana sayfa">

          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 12h3l2-5 4 10 3-7 2 2h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Ritma
      </a>
    </div>
  </header>

  <main class="container">
    <section class="api-docs-intro">
      <h1>API Deneme</h1>
      <p>Backend uç noktalarını buradan deneyebilirsiniz. Veriler bellekte; sunucu yeniden başlayınca örnek veriye döner.</p>
